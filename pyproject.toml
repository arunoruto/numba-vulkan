[project]
name = "numba-vulkan"
version = "0.1.0"
description = "A Vulkan compute target for Numba: Python kernels on any GPU with a Vulkan driver"
readme = "README.md"
# Distributions bundle libclc's bitcode, which is under LLVM's licence.
license = "BSD-2-Clause AND Apache-2.0 WITH LLVM-exception"
license-files = ["LICENSE", "src/numba_vulkan/data/LICENSE-libclc.txt"]
authors = [{ name = "Mirza Arnaut", email = "mirza.arnaut@tu-dortmund.de" }]
requires-python = ">=3.11"
keywords = ["numba", "vulkan", "gpu", "spir-v", "jit", "compiler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "numba>=0.68",
    "llvmlite>=0.50",
    "numpy>=1.25",
    "vulkan>=1.3.275",
]

[project.urls]
Repository = "https://github.com/arunoruto/numba-vulkan"
Documentation = "https://arunoruto.github.io/numba-vulkan/"
Issues = "https://github.com/arunoruto/numba-vulkan/issues"
Changelog = "https://github.com/arunoruto/numba-vulkan/blob/main/CHANGELOG.md"

[dependency-groups]
docs = [
    "myst-parser>=4.0.1",
    "pydata-sphinx-theme>=0.16.1",
    "sphinx-autoapi>=3.6.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx>=8.1.3",
    "linkify-it-py>=2.0.3",
    "matplotlib>=3.10",
]
bench = [
    # CUDA does not exist on macOS, and numba-cuda has no wheels there.
    "numba-cuda[cu12]>=0.30.4; sys_platform != 'darwin'",
    "numpy<2.5",
]
test = [
    "pytest>=8.0",
]
# Pinned: new ruff versions enable new rules by default.
lint = [
    "ruff>=0.16.8,<0.17",
]

[tool.uv]
package = true
default-groups = ["test"]

[tool.semantic_release]
# Releases are made by the "Build and publish" workflow; see
# docs/source/development.md.
version_toml = ["pyproject.toml:project.version"]
# Stay on 0.x: the first release is 0.1.0, and breaking changes raise the
# minor version until 1.0.0 is chosen.
allow_zero_version = true
major_on_zero = false
commit_message = "chore(release): v{version}\n\nAutomatically generated by python-semantic-release"
# Keeps the project's entry in uv.lock at the new version. The release
# action runs in a container of its own, which has no uv.
build_command = """
python -m pip install --quiet "uv>=0.8,<1"
uv lock --upgrade-package numba-vulkan
git add uv.lock
"""

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
# Conventional commit types, and this project's `bench` and `release`.
allowed_tags = [
    "feat", "fix", "perf", "refactor", "docs", "test", "build", "ci", "chore",
    "style", "bench", "release",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = ['Merge pull request #\d+', 'chore\(release\):']

[tool.ruff]
# Code blocks in the documentation align their comments on purpose.
extend-exclude = ["*.md"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "float64: needs a device with float64; skipped on the others, which compute in float32",
]

[build-system]
requires = ["uv_build >= 0.8.0, <0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "numba_vulkan"
module-root = "src"
