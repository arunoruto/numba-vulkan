[project]
name = "numba-vulkan"
version = "0.1.0"
description = "Proof of concept: a Vulkan compute target for Numba"
readme = "README.md"
# Distributions bundle libclc's bitcode, which is under LLVM's licence.
license = "BSD-2-Clause AND Apache-2.0 WITH LLVM-exception"
license-files = ["LICENSE", "src/numba_vulkan/data/LICENSE-libclc.txt"]
authors = [{ name = "Mirza Arnaut", email = "mirza.arnaut@tu-dortmund.de" }]
requires-python = ">=3.11"
dependencies = [
    "numba>=0.68",
    "llvmlite>=0.50",
    "numpy>=1.25",
    "vulkan>=1.3.275",
]

[project.urls]
Repository = "https://github.com/arunoruto/numba-vulkan"
Documentation = "https://arunoruto.github.io/numba-vulkan/"
Issues = "https://github.com/arunoruto/numba-vulkan/issues"

[dependency-groups]
docs = [
    "myst-parser>=4.0.1",
    "pydata-sphinx-theme>=0.16.1",
    "sphinx-autoapi>=3.6.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx>=8.1.3",
    "linkify-it-py>=2.0.3",
    "matplotlib>=3.10",
]
bench = [
    # CUDA does not exist on macOS, and numba-cuda has no wheels there.
    "numba-cuda[cu12]>=0.30.4; sys_platform != 'darwin'",
    "numpy<2.5",
]
test = [
    "pytest>=8.0",
]
# Pinned: new ruff versions enable new rules by default.
lint = [
    "ruff>=0.16.8,<0.17",
]

[tool.uv]
package = true
default-groups = ["test"]

[tool.ruff]
# Code blocks in the documentation align their comments on purpose.
extend-exclude = ["*.md"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "float64: needs a device with float64; skipped on the others, which compute in float32",
]

[build-system]
requires = ["uv_build >= 0.8.0, <0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "numba_vulkan"
module-root = "src"
