[project]
name = "numba-vulkan"
version = "0.0.1"
description = "Proof of concept: a Vulkan compute target for Numba"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Mirza Arnaut", email = "mirza.arnaut@tu-dortmund.de" }]
requires-python = ">=3.11"
dependencies = [
    "numba>=0.68",
    "llvmlite>=0.50",
    "numpy>=1.25",
    "vulkan>=1.3.275",
]

[project.urls]
Repository = "https://github.com/arunoruto/numba-vulkan"
Documentation = "https://arunoruto.github.io/numba-vulkan/"
Issues = "https://github.com/arunoruto/numba-vulkan/issues"

[dependency-groups]
docs = [
    "myst-parser>=4.0.1",
    "pydata-sphinx-theme>=0.16.1",
    "sphinx-autoapi>=3.6.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx>=8.1.3",
    "linkify-it-py>=2.0.3",
]
bench = [
    "numba-cuda[cu12]>=0.30.4",
    "numpy<2.5",
]
test = [
    "pytest>=8.0",
]

[tool.uv]
package = true
default-groups = ["test"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[build-system]
requires = ["uv_build >= 0.8.0, <0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "numba_vulkan"
module-root = "src"
