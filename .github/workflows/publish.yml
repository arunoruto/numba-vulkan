name: "Build and publish"

# Builds the sdist and wheel (with libclc bundled) and checks that the wheel
# runs a kernel on lavapipe, Mesa's CPU Vulkan driver. The released wheel
# bundles libclc built by nix/libclc.nix against the nixpkgs that
# devenv.lock pins; the check installs it into a plain uv-managed Python,
# outside Nix. A second build takes libclc from conda-forge, so that
# building without Nix keeps working.
#
# Releasing: run this workflow by hand on main. After the test suite has
# passed, on Linux and on Windows (windows.yml), python-semantic-release
# derives the next version from the commit messages since the last release
# (configured in pyproject.toml), updates pyproject.toml, uv.lock and
# CHANGELOG.md, commits, tags and creates the GitHub release. The
# distributions built from that tag are attached to the release and uploaded
# to PyPI through trusted publishing (no token), from the `pypi`
# environment; PyPI knows this workflow by its file name. Without commits
# that call for a release, nothing is released. Pull requests that change
# the packaging only build and check.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >
          An existing release tag (such as v0.1.0) to build and publish
          again, instead of making a new release; for a release whose
          publishing failed
        required: false
        default: ""
  pull_request:
    paths:
      - "pyproject.toml"
      - "Makefile"
      - "scripts/**"
      - "nix/**"
      - "devenv.lock"
      - ".github/workflows/publish.yml"

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name == 'workflow_dispatch' && !inputs.tag
    uses: ./.github/workflows/tests.yml

  windows:
    if: github.event_name == 'workflow_dispatch' && !inputs.tag
    uses: ./.github/workflows/windows.yml

  release:
    needs: [tests, windows]
    if: >
      github.event_name == 'workflow_dispatch' && !inputs.tag
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released || 'false' }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Release from the commit the workflow started on
        run: git reset --hard ${{ github.sha }}

      # Also refuses to release if main has moved on since the run started.
      - name: Version, changelog, tag and GitHub release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

  build:
    needs: release
    # Pull requests and a given tag skip the release; then the build runs on
    # its own.
    if: >
      !cancelled() && (github.event_name == 'pull_request'
      || needs.release.outputs.released == 'true' || inputs.tag)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        libclc: [nix, conda]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag || inputs.tag || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install Nix
        if: matrix.libclc == 'nix'
        uses: cachix/install-nix-action@v31.11.1

      - name: Install the Vulkan loader and lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers

      - name: Check that the release tag matches the version
        if: needs.release.outputs.released == 'true' || inputs.tag
        env:
          TAG: ${{ needs.release.outputs.tag || inputs.tag }}
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match version $version" >&2
            exit 1
          fi

      - name: Build
        run: make dist LIBCLC_SOURCE=${{ matrix.libclc }}

      - name: Run a kernel with the wheel
        run: make check

      - name: Keep the distributions
        if: matrix.libclc == 'nix'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: [release, build]
    if: >
      !cancelled() && needs.build.result == 'success'
      && (needs.release.outputs.released == 'true' || inputs.tag)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/numba-vulkan/
    permissions:
      contents: write  # release assets
      id-token: write  # trusted publishing
    steps:
      - name: Fetch the distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # gh rather than python-semantic-release's publish action, which
      # needs a branch checked out and refuses to work on a tag.
      - name: Attach them to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag || inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
