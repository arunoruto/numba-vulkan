name: "Build and publish"

# Builds the sdist and wheel (with libclc bundled) and checks that the wheel
# runs a kernel on lavapipe, Mesa's CPU Vulkan driver. Publishing to PyPI
# happens only for a published GitHub release, through PyPI's trusted
# publishing (no token), from the `pypi` environment.

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "Makefile"
      - "scripts/**"
      - ".github/workflows/publish.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install the Vulkan loader and lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers

      - name: Check that the release tag matches the version
        if: github.event_name == 'release'
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi

      - name: Build
        run: make dist

      - name: Run a kernel with the wheel
        run: make check

      - name: Keep the distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/numba-vulkan/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - name: Fetch the distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
