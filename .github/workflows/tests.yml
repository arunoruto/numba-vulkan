name: "Tests"

# The test suite on lavapipe (Mesa's CPU Vulkan driver), with every shader
# checked by spirv-val and the runtime's use of Vulkan by Khronos'
# validation layer, including synchronization (NUMBA_VULKAN_DEBUG=2).
# libclc comes from conda-forge (make libclc without Nix). It runs on every
# supported Python with the locked dependencies, and once with the newest
# releases of them, as `pip install` would get them; weekly as well, to
# notice new releases of Numba or llvmlite that break it. The run with the
# newest releases goes without spirv-val, as most users' machines do.

on:
  workflow_dispatch:
  workflow_call:  # by the release, in publish.yml
  schedule:
    - cron: "0 4 * * 1"  # Mondays, 04:00 UTC
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - "scripts/**"
      - ".github/workflows/tests.yml"

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Ruff
        run: |
          uv run --only-group lint ruff check
          uv run --only-group lint ruff format --check

  lavapipe:
    name: lavapipe (Python ${{ matrix.python }}${{ matrix.newest && ', newest dependencies' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        newest: [false]
        include:
          - python: "3.14"
            newest: true
    env:
      NUMBA_VULKAN_DEBUG: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}

      - name: Use the newest releases of the dependencies
        if: matrix.newest
        run: |
          uv lock --upgrade
          uv tree --depth 1

      - name: Install lavapipe, the validation layer and SPIRV-Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 mesa-vulkan-drivers vulkan-validationlayers vulkan-tools \
            ${{ !matrix.newest && 'spirv-tools' || '' }}
          vulkaninfo --summary | grep -E "deviceName|driverInfo|apiVersion"

      - name: Get libclc
        run: make libclc

      - name: Run the tests
        run: >
          uv run pytest -q -rxXs
          -W "ignore::numba_vulkan.VulkanValidationWarning"
